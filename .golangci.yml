version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

# The standard set (errcheck, govet, ineffassign, staticcheck, unused) plus
# linters that catch real bugs. Style and complexity linters (revive, godot,
# perfsprint, modernize, mnd, wrapcheck, funlen, gocognit, cyclop, nestif) are
# not enforced: they would mean rewriting large parts of the code base for no
# change in behaviour.
linters:
  default: standard
  enable:
    - asasalint
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - exhaustive
    - gosec
    - misspell
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    - unconvert
    - unparam
    - wastedassign

  settings:
    exhaustive:
      default-signifies-exhaustive: true
      # The parser switches on the few tokens a directive accepts; listing the
      # other hundred-odd token types would add nothing.
      ignore-enum-types: "recipe\\.TokenType"
    gosec:
      excludes:
        - G104 # unchecked errors: errcheck covers this
        - G115 # integer conversions: values are ports, counts and sizes
        - G204 # mozza runs docker, kubectl and git with arguments by design
        - G301 # project directories are meant to be readable (0755)
        - G306 # recipes, compose files and manifests are meant to be readable (0644)
        - G706 # log values go through slog attributes, which the handler escapes

  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gshepptech/mozza
